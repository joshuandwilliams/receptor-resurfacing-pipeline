# =============================================================================
# Pipeline params for pikp1_avrpia campaign, run v1_4f_rfdtest_2
#
# Larger run using the same parameters as v1_4f_rfdtest_1 (which showed
# promising results — design_2 made 81 Cα contacts with the AVR-Pia hotspot
# vs 8 in the input). Identical in every way except num_designs: 64 and
# rfdiff_iterations: 100 (full diffusion). Pipeline stops after Rosetta.
#
# Key differences from v1_4f_rfdtest_1:
#   - num_designs: 64
#   - rfdiff_iterations: 100 (restored to full diffusion)
#   - rfdiff_checkpoint: Complex_beta_ckpt.pt
#   - add_potential: true (interface_ncontacts + monomer_ROG)
#   - hotspot: B37-B43 (AVR-Pia beta strand — most likely replacement
#     contact point for the PikF loop region absent in Pia)
#   - contigs: C-terminal region fixed to 10-10 (input gap = 10 residues,
#     69-78); N-terminal region pushed to 25-35 to bridge the larger gap
#     that AVR-Pia's missing loop creates
#   - stop_after_rosetta: true
#
# Submit:
#   sbatch run_pipeline.slurm.sh ./experiments/campaigns/pikp1_avrpia/runs/v1_4f_rfdtest_1/params.yml
#
# To continue to MPNN once satisfied with Sc scores:
#   Change stop_after_rosetta to false and resubmit with --resume
# =============================================================================

# ── Project ───────────────────────────────────────────────────────────
project_name: "PikP1_AvrPia_v1_4f_rfdtest_2"
outdir: "/hpc-home/jowillia/receptor_design/receptor-resurfacing-pipeline/experiments/campaigns/pikp1_avrpia/runs/v1_4f_rfdtest_2/results"

# ── Execution ─────────────────────────────────────────────────────────
max_boltz2_parallel: 24

# ═════════════════════════════════════════════════════════════════════════
# INPUT MODE 2: Pre-docked complex PDB
# ═════════════════════════════════════════════════════════════════════════
pdb_file: "/hpc-home/jowillia/receptor_design/receptor-resurfacing-pipeline/experiments/campaigns/pikp1_avrpia/inputs/pikp1_avrpia_pik_interface_complex.pdb"
hotspot: "B37,B38,B39,B40,B41,B42,B43"

# ═════════════════════════════════════════════════════════════════════════
# SHARED SETTINGS
# ═════════════════════════════════════════════════════════════════════════

# ── Chain identifiers ─────────────────────────────────────────────────
receptor_chain: "A"
effector_chain: "B"

# ── HADDOCK3 (modes 1/3 only — UNUSED in mode 2) ──────────────────────
haddock_sampling: 1
haddock_seletop: 1
effector_active_residues: ""

# ── RFDiffusion ───────────────────────────────────────────────────────
# C-terminal region fixed to 10-10: input gap is residues 69-78 (10 aa),
# keeping the same length avoids unnecessary backbone perturbation there.
# N-terminal region 25-35: increased from 10-30 to bridge the ~10-15 Å
# gap left by the absence of the PikF loop that contacts b2.
contigs: "A1-32/25-35/A50-68/10-10 B"
num_designs: 64
rfdiff_iterations: 100
rfdiff_checkpoint: "Complex_beta_ckpt.pt"
min_hotspot_frac: 0.0
rfdiff_contact_cutoff: 8.0
add_potential: true
rfdiff_guide_scale: 2
rfdiff_guide_decay: "quadratic"
rfdiff_interface_weight: 1.0
rfdiff_rog_weight: 0.5
rfdiff_rog_min_dist: 5

# ── Rosetta pre-validation ────────────────────────────────────────────
sc_threshold: 0.5
stop_after_rosetta: true

# ── ProteinMPNN (unused — stop_after_rosetta: true) ───────────────────
num_seqs: 2
mpnn_sampling_temp: 0.25
rm_aa: "C"
mpnn_top_n: 128

# ── ProteinMPNN sequence quality control ──────────────────────────────
max_poly_x: 5
min_pct_identity: 0.0
max_pct_identity: 100.0

# ═════════════════════════════════════════════════════════════════════════
# Boltz2 negative-steering (unused — stop_after_rosetta: true)
# ═════════════════════════════════════════════════════════════════════════
negsteer_mode: "mild"
negsteer_max_mutations: 6
negsteer_candidate_pool_size: 10
negsteer_protected_set_source: "design_region_union"
negsteer_n_designs: 3
negsteer_num_seeds: 3
negsteer_n_cycles: 1
negsteer_diffusion_samples: 5
negsteer_recycling_steps: 3
negsteer_rmsd_threshold: 6.0
negsteer_contact_cutoff: 4.5
negsteer_no_kernels: true
negsteer_postprocess_rmsd_threshold: 5.0
negsteer_postprocess_metric_column: "steered_ra_eff_vs_truth"
negsteer_postprocess_contact_cutoff: 5.0

# ── Negative controls ─────────────────────────────────────────────────
run_negative_controls: true
negsteer_controls_n_designs: 1
controls_warning_ipsae_max: 0.5
controls_warning_ra_eff_min: 5.0

# ── Interface metrics ─────────────────────────────────────────────────
interface_plddt_trim_threshold: 50.0
interface_intact_threshold: 5.0
weighted_jaccard_pair_cutoff: 8.0

# ── Orthogonal validation metrics ─────────────────────────────────────
af3_nomsa_seeds: [42, 123, 456]
orthogonal_filter_sc_min: 0.55
orthogonal_filter_bsa_min: 600
orthogonal_filter_plddt_min: 0.75
orthogonal_filter_af3_ra_max: 5.0
