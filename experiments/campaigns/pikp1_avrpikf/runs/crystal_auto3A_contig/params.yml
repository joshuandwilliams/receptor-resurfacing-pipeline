# =============================================================================
# Pipeline params for pikp1_avrpikf campaign, run crystal_auto3A_contig
#
# Input  : pikp1_avrpikf_pik_interface_complex.pdb (PDB 6G10-aligned crystal pose).
# Contig : auto-derived from binder residues within 3 A heavy-atom contact of the
#          effector in THIS pose, join-gap <= 1, strategy-4a length scaling.
#          Redesigns A3, A32-33, A39, A43, A68-70, A74-78 (13 residues, 6 segments
#          of lengths 1/2/1/1/3/5).
#
# Cell (3 of 6) in the 2 inputs x 3 contigs factorial.
# Note: 3 A contig is the most fragmented — multiple 1-residue segments may give
# RFDiffusion limited geometric flexibility.
# =============================================================================

# ── Project ───────────────────────────────────────────────────────────
project_name: "PikP1_AvrPikF_crystal_auto3A_contig"
outdir: "/hpc-home/jowillia/receptor_design/receptor-resurfacing-pipeline/experiments/campaigns/pikp1_avrpikf/runs/crystal_auto3A_contig/results"

# ── Execution ─────────────────────────────────────────────────────────
max_boltz2_parallel: 24

# ═════════════════════════════════════════════════════════════════════════
# INPUT MODE 2: Pre-docked complex PDB
# ═════════════════════════════════════════════════════════════════════════
pdb_file: "/hpc-home/jowillia/receptor_design/receptor-resurfacing-pipeline/experiments/campaigns/pikp1_avrpikf/inputs/pikp1_avrpikf_pik_interface_complex.pdb"
hotspot: ""

# ═════════════════════════════════════════════════════════════════════════
# SHARED SETTINGS
# ═════════════════════════════════════════════════════════════════════════

# ── Chain identifiers ─────────────────────────────────────────────────
receptor_chain: "A"
effector_chain: "B"

# ── HADDOCK3 (modes 1/3 only — UNUSED in mode 2) ──────────────────────
haddock_sampling: 100
haddock_seletop: 1
effector_active_residues: ""

# ── RFDiffusion ───────────────────────────────────────────────────────
contigs: "A1-2/1-1/A4-31/1-3/A34-38/1-1/A40-42/1-1/A44-67/2-5/A71-73/4-8 B"
num_designs: 64
rfdiff_iterations: 100
rfdiff_checkpoint: "Complex_beta_ckpt.pt"
min_hotspot_frac: 0.0
rfdiff_contact_cutoff: 8.0
add_potential: true
rfdiff_guide_scale: 2
rfdiff_guide_decay: "quadratic"
rfdiff_interface_weight: 1.0
rfdiff_rog_weight: 0.5
rfdiff_rog_min_dist: 5

# ── Rosetta pre-validation ────────────────────────────────────────────
sc_threshold: 0.3
stop_after_rosetta: false

# ── ProteinMPNN ───────────────────────────────────────────────────────
num_seqs: 2
mpnn_sampling_temp: 0.25
rm_aa: "C"
mpnn_top_n: 128

# ── ProteinMPNN sequence quality control ──────────────────────────────
max_poly_x: 5
min_pct_identity: 0.0
max_pct_identity: 100.0

# ═════════════════════════════════════════════════════════════════════════
# Boltz2 negative-steering
# ═════════════════════════════════════════════════════════════════════════
negsteer_mode: "mild"
negsteer_max_mutations: 6
negsteer_candidate_pool_size: 10
negsteer_protected_set_source: "design_region_union"
negsteer_n_designs: 3
negsteer_num_seeds: 3
negsteer_n_cycles: 1
negsteer_diffusion_samples: 5
negsteer_recycling_steps: 3
negsteer_rmsd_threshold: 6.0
negsteer_contact_cutoff: 4.5
negsteer_no_kernels: true
negsteer_postprocess_rmsd_threshold: 5.0
negsteer_postprocess_metric_column: "steered_ra_eff_vs_truth"
negsteer_postprocess_contact_cutoff: 5.0

# ── Negative controls ─────────────────────────────────────────────────
run_negative_controls: true
negsteer_controls_n_designs: 1
controls_warning_ipsae_max: 0.5
controls_warning_ra_eff_min: 5.0

# ── Interface metrics ─────────────────────────────────────────────────
interface_plddt_trim_threshold: 50.0
interface_intact_threshold: 5.0
weighted_jaccard_pair_cutoff: 8.0

# ── Orthogonal validation metrics ─────────────────────────────────────
af3_nomsa_seeds: [42, 123, 456]
orthogonal_filter_sc_min: 0.55
orthogonal_filter_bsa_min: 600
orthogonal_filter_plddt_min: 0.75
orthogonal_filter_af3_ra_max: 5.0
