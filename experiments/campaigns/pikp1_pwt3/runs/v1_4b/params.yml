# =============================================================================
# Pipeline params for pikp1_pwt3 campaign, run v1_4b
#
# Strategy 4b (literature-derived contig — manual, binding-face based) applied
# to the pikp1 binder against the PWT3 effector. The contig comes from §6.2
# of experiments/campaigns/pikp1_pwt3/inputs/pikp1_pwt3_literature_sweep.md
# and assumes the canonical AVR-Pik face is the binding face — flexes
# Interface 2 (chain A pipeline 33-49) and Interface 3 (chain A 69-78), the
# same layout as the pikp1_avrpikf primary contig.
#
# ⚠ DO NOT LAUNCH UNTIL the AF3 monomer prediction at
#   experiments/inputs/structures/AF3/Pwt3.pdb has been:
#   (1) generated from the slurm job at AF3/pwt3/alphafold3_pwt3.slurm.sh,
#   (2) inspected to confirm a MAX-like β-sandwich fold (Scenario A in
#       lit-sweep §3.2), and
#   (3) used to assemble pikp1_pwt3_complex.pdb via the chimerax txt file
#       in inputs/.
# If AF3 returns a non-MAX fold, this contig is INVALID — fall back to
# AF3-multimer (Scenario B) and rederive the contig from the predicted
# binding interface before running.
#
# A0A223ZP76 is the B-type (virulent on Rwt3-wheat) PWT3 allele. Both Ao-type
# and B-type are valid design targets; the Ao-type would require fetching a
# DDBJ sequence (LC202650-657) and rerunning AF3.
#
# Submit:
#   sbatch run_pipeline.slurm.sh ./experiments/campaigns/pikp1_pwt3/runs/v1_4b/params.yml
#
# Resume after partial completion:
#   sbatch run_pipeline.slurm.sh ./experiments/campaigns/pikp1_pwt3/runs/v1_4b/params.yml --resume
# =============================================================================

# ── Project ───────────────────────────────────────────────────────────
project_name: "PikP1_Pwt3_v1_4b"
outdir: "/hpc-home/jowillia/receptor_design/receptor-resurfacing-pipeline/experiments/campaigns/pikp1_pwt3/runs/v1_4b/results"

# ── Execution ─────────────────────────────────────────────────────────
max_boltz2_parallel: 24

# ═════════════════════════════════════════════════════════════════════════
# INPUT MODE 2: Pre-docked complex PDB
# ═════════════════════════════════════════════════════════════════════════
pdb_file: "/hpc-home/jowillia/receptor_design/receptor-resurfacing-pipeline/experiments/campaigns/pikp1_pwt3/inputs/pikp1_pwt3_complex.pdb"
hotspot: ""

# ═════════════════════════════════════════════════════════════════════════
# SHARED SETTINGS
# ═════════════════════════════════════════════════════════════════════════

# ── Chain identifiers ─────────────────────────────────────────────────
receptor_chain: "A"
effector_chain: "B"

# ── HADDOCK3 (modes 1/3 only — UNUSED in mode 2) ──────────────────────
# These have no effect on this run but are required by the schema.
haddock_sampling: 1
haddock_seletop: 1
effector_active_residues: ""

# ── RFDiffusion ───────────────────────────────────────────────────────
contigs: "A1-32/12-20/A50-68/8-14 B"
num_designs: 64
rfdiff_iterations: 100
min_hotspot_frac: 0.0
rfdiff_contact_cutoff: 8.0

# ── Rosetta pre-validation ────────────────────────────────────────────
sc_threshold: 0.5

# ── ProteinMPNN ───────────────────────────────────────────────────────
num_seqs: 2
mpnn_sampling_temp: 0.25
rm_aa: "C"
mpnn_top_n: 128

# ── ProteinMPNN sequence quality control ───────────────────────────────────────────────────
max_poly_x: 5
min_pct_identity: 0.0
max_pct_identity: 100.0

# ═════════════════════════════════════════════════════════════════════════
# Boltz2 negative-steering — all values from test_negative_steering.nf
# ═════════════════════════════════════════════════════════════════════════

# Steering strategy
negsteer_mode: "mild"
negsteer_max_mutations: 6
negsteer_candidate_pool_size: 10
negsteer_protected_set_source: "design_region_union"

# Design / seed counts
negsteer_n_designs: 3
negsteer_num_seeds: 3
negsteer_n_cycles: 1

# Boltz prediction hyperparameters
negsteer_diffusion_samples: 5
negsteer_recycling_steps: 3
negsteer_rmsd_threshold: 6.0
negsteer_contact_cutoff: 4.5
negsteer_no_kernels: true

# Post-processing thresholds
negsteer_postprocess_rmsd_threshold: 5.0
negsteer_postprocess_metric_column: "steered_ra_eff_vs_truth"
negsteer_postprocess_contact_cutoff: 5.0

# ── Negative controls ─────────────────────────────────────────────────
run_negative_controls: true
negsteer_controls_n_designs: 1
controls_warning_ipsae_max: 0.5
controls_warning_ra_eff_min: 5.0

# ── Interface metrics ─────────────────────────────────────────
interface_plddt_trim_threshold: 50.0
interface_intact_threshold: 5.0
weighted_jaccard_pair_cutoff: 8.0

# ── Orthogonal validation metrics ─────────────────────────────────────
af3_nomsa_seeds: [42, 123, 456]
orthogonal_filter_sc_min: 0.55
orthogonal_filter_bsa_min: 600
orthogonal_filter_plddt_min: 0.75
orthogonal_filter_af3_ra_max: 5.0
