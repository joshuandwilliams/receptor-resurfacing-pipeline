# =============================================================================
# Pipeline params for pikp1_pwt7 campaign, run v1_4b
#
# Strategy 4b (literature-derived contig — manual, binding-face based) applied
# to the pikp1 binder against the PWT7 effector. The contig comes from §6.2
# of experiments/campaigns/pikp1_pwt7/inputs/pikp1_pwt7_literature_sweep.md
# and flexes the entire N-terminal β1/M1 face of Pikp-HMA (chain A pipeline
# 1-30) — the face that contacts PWT7 in the Rwt7-HMA / PWT7 complex (9TFP;
# Yu et al. 2025 bioRxiv). Note: this region is anchored in every other
# pikp1_* campaign — pwt7 is the only one targeting the N-terminal face.
#
# Caveat: Pikp-HMA does not natively bind PWT7; the input complex is a
# starting-geometry model from cross-system superposition onto Rwt7-HMA.
#
# Submit:
#   sbatch run_pipeline.slurm.sh ./experiments/campaigns/pikp1_pwt7/runs/v1_4b/params.yml
#
# Resume after partial completion:
#   sbatch run_pipeline.slurm.sh ./experiments/campaigns/pikp1_pwt7/runs/v1_4b/params.yml --resume
# =============================================================================

# ── Project ───────────────────────────────────────────────────────────
project_name: "PikP1_Pwt7_v1_4b"
outdir: "/hpc-home/jowillia/receptor_design/receptor-resurfacing-pipeline/experiments/campaigns/pikp1_pwt7/runs/v1_4b/results"

# ── Execution ─────────────────────────────────────────────────────────
max_boltz2_parallel: 24

# ═════════════════════════════════════════════════════════════════════════
# INPUT MODE 2: Pre-docked complex PDB
# ═════════════════════════════════════════════════════════════════════════
pdb_file: "/hpc-home/jowillia/receptor_design/receptor-resurfacing-pipeline/experiments/campaigns/pikp1_pwt7/inputs/pikp1_pwt7_complex.pdb"
hotspot: ""

# ═════════════════════════════════════════════════════════════════════════
# SHARED SETTINGS
# ═════════════════════════════════════════════════════════════════════════

# ── Chain identifiers ─────────────────────────────────────────────────
receptor_chain: "A"
effector_chain: "B"

# ── HADDOCK3 (modes 1/3 only — UNUSED in mode 2) ──────────────────────
# These have no effect on this run but are required by the schema.
haddock_sampling: 1
haddock_seletop: 1
effector_active_residues: ""

# ── RFDiffusion ───────────────────────────────────────────────────────
contigs: "15-28/A31-78 B"
num_designs: 64
rfdiff_iterations: 100
min_hotspot_frac: 0.0
rfdiff_contact_cutoff: 8.0

# ── Rosetta pre-validation ────────────────────────────────────────────
sc_threshold: 0.5

# ── ProteinMPNN ───────────────────────────────────────────────────────
num_seqs: 2
mpnn_sampling_temp: 0.25
rm_aa: "C"
mpnn_top_n: 128

# ── ProteinMPNN sequence quality control ───────────────────────────────────────────────────
max_poly_x: 5
min_pct_identity: 0.0
max_pct_identity: 100.0

# ═════════════════════════════════════════════════════════════════════════
# Boltz2 negative-steering — all values from test_negative_steering.nf
# ═════════════════════════════════════════════════════════════════════════

# Steering strategy
negsteer_mode: "mild"
negsteer_max_mutations: 6
negsteer_candidate_pool_size: 10
negsteer_protected_set_source: "design_region_union"

# Design / seed counts
negsteer_n_designs: 3
negsteer_num_seeds: 3
negsteer_n_cycles: 1

# Boltz prediction hyperparameters
negsteer_diffusion_samples: 5
negsteer_recycling_steps: 3
negsteer_rmsd_threshold: 6.0
negsteer_contact_cutoff: 4.5
negsteer_no_kernels: true

# Post-processing thresholds
negsteer_postprocess_rmsd_threshold: 5.0
negsteer_postprocess_metric_column: "steered_ra_eff_vs_truth"
negsteer_postprocess_contact_cutoff: 5.0

# ── Negative controls ─────────────────────────────────────────────────
run_negative_controls: true
negsteer_controls_n_designs: 1
controls_warning_ipsae_max: 0.5
controls_warning_ra_eff_min: 5.0

# ── Interface metrics ─────────────────────────────────────────
interface_plddt_trim_threshold: 50.0
interface_intact_threshold: 5.0
weighted_jaccard_pair_cutoff: 8.0

# ── Orthogonal validation metrics ─────────────────────────────────────
af3_nomsa_seeds: [42, 123, 456]
orthogonal_filter_sc_min: 0.55
orthogonal_filter_bsa_min: 600
orthogonal_filter_plddt_min: 0.75
orthogonal_filter_af3_ra_max: 5.0
