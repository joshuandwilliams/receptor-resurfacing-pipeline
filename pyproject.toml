[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "receptor-resurfacing-pipeline"
version = "0.0.0"
description = "Receptor-resurfacing de novo binder design pipeline (Nextflow + Python)."
requires-python = ">=3.10"

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "Pillow>=10.0",
    "scikit-image>=0.21",
]
experiments = [
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
# The whole tree, not just characterization/.  The other directories hold the
# per-module Nextflow tests and their fixtures, and the plot harnesses there
# are named iterate_*.py so pytest does not import them.
testpaths = ["tests"]
addopts = "--strict-markers -ra"
# Two markers, each naming what it needs rather than where it runs.
#
# The previous set had eight.  `local_unit` and `local_integration` both ran on
# a laptop with nothing installed beyond the test extra, and the second was
# never applied to a test, so the split only decided which of two command lines
# invoked them.  `hpc` named a machine when the real requirement is a finished
# run.  `wave1` selected exactly the same 298 tests as `hpc`, in the same eight
# files, so it could not narrow anything.  `wave2`,
# `requires_populated_reversion` and `requires_controls` were declared and
# never used.  `slow` likewise; add it back when there is a slow test to carry
# it, since --strict-markers only rejects a marker that is used without being
# declared.
markers = [
    "logic: runs anywhere with Python. Comparator and helper tests on synthetic or committed input. No cluster, no container.",
    "check_test_run: asserts on the output of a real pipeline run. Needs RECEPTOR_OUTPUT_ROOT pointing at a finished run tree.",
]
