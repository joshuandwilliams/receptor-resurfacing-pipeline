[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "receptor-resurfacing-pipeline"
version = "0.4.0"
description = "Receptor-resurfacing de novo binder design pipeline (Nextflow + Python)."
requires-python = ">=3.10"

[project.optional-dependencies]
# The whole dependency list for the logic tier.  A laptop's conda environment
# supplies these for free and a CI runner does not, so anything missing here
# fails in CI rather than passing locally by accident.
#
# pandas is capped below 3 deliberately.  pandas 3 gives a text column read by
# read_csv dtype `str` rather than `object`, which silently disabled the path
# normalisation in tests/characterization/helpers/csv_compare.py.  That guard
# is fixed and works under both, so the cap is about pinning what CI measures
# rather than about a remaining incompatibility.  Raise it when the figure and
# table comparators have been checked against 3.x.
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pandas>=2.0,<4",
    "numpy>=1.24",
    "Pillow>=10.0",
    "scikit-image>=0.21",
    # gemmi was missing and the omission was invisible on a laptop, where
    # conda supplies it.  In a clean venv the seven structure tests in
    # test_protein_structure_prediction.py skip with "gemmi not installed"
    # instead of running, so CI reported a pass for tests it never executed.
    "gemmi>=0.6",
    # biopython is imported by bin/ and by the campaign extractors for
    # sequence-aligned residue pairing.  No logic-tier test reaches it today,
    # so it is here to keep the extra a true statement of what the code needs
    # rather than to fix a skip.
    "biopython>=1.80",
    # matplotlib and scipy are imported by the plot modules and the pose
    # solver.  The figure tests go through tests/characterization/helpers,
    # which needs them present to compare a rendered PNG.
    "matplotlib>=3.7",
    "scipy>=1.10",
]
# The pinned linter, so CI and a local run apply the same rule set.  An
# unpinned ruff picks up new default rules on release and fails CI on code
# that passed locally.
dev = [
    "ruff==0.15.21",
]

[tool.setuptools]
packages = []

[tool.ruff]
line-length = 100
target-version = "py310"
# experiments/ holds the twelve campaign analyses and their helper scripts.
# They are leaving this repository for receptor-resurfacing-analyses, so
# linting them here is work that moves with them.  Add them to that
# repository's own lint run instead.
#
# The two notebooks under scripts/ are a Colab-era RFDiffusion driver and a
# teaching notebook.  Nothing imports either, and a notebook's cell order
# makes I001 and F811 meaningless, so neither is linted.
exclude = [
    "experiments",
    "scripts/RFDiffusion_JoshW_v4_incremental_save_2.ipynb",
    "scripts/pipeline_intro_for_students.ipynb",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
# bin/ is linted like the rest of the repo.  Its sibling imports follow a
# deliberate sys.path setup, marked with noqa: E402 where it occurs, because a
# Nextflow stage invokes each script by absolute path with no PYTHONPATH.

[tool.pytest.ini_options]
# The whole tree, not just characterization/.  The other directories hold the
# per-module Nextflow tests and their fixtures, and the plot harnesses there
# are named iterate_*.py so pytest does not import them.
testpaths = ["tests"]
# Coverage runs on every invocation over bin/, so bin/ is visible rather than
# hidden.  The gate is a ratchet; see [tool.coverage.report].
addopts = """
    --strict-markers -ra
    --cov=bin
    --cov-report=lcov:lcov.info
    --cov-report=term-missing:skip-covered
"""
# Two markers, each naming what it needs rather than where it runs.
#
# The previous set had eight.  `local_unit` and `local_integration` both ran on
# a laptop with nothing installed beyond the test extra, and the second was
# never applied to a test, so the split only decided which of two command lines
# invoked them.  `hpc` named a machine when the real requirement is a finished
# run.  `wave1` selected exactly the same 298 tests as `hpc`, in the same eight
# files, so it could not narrow anything.  `wave2`,
# `requires_populated_reversion` and `requires_controls` were declared and
# never used.  `slow` likewise; add it back when there is a slow test to carry
# it, since --strict-markers only rejects a marker that is used without being
# declared.
markers = [
    "logic: runs anywhere with Python. Comparator and helper tests on synthetic or committed input. No cluster, no container.",
    "check_test_run: asserts on the output of a real pipeline run. Needs RECEPTOR_OUTPUT_ROOT pointing at a finished run tree.",
]

[tool.coverage.run]
source = ["bin"]

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
show_missing = true
skip_covered = true

# A ratchet over bin/.  It may only ever go up.  Raise it to whatever a run
# reports once new tests land, so coverage cannot quietly fall.
#
# 16.5 is where the logic tier stands now that the five vendored engine
# modules are gone: 16.58% covered.  It was 10.81% over 14820 statements while
# this repository still carried 12,996 lines of engine that no test here could
# reach, which is exactly the 5215 statements at 0% that deleting them
# removed.  It is low for a reason
# that is worth writing down rather than hiding.  Most of bin/ is only reached
# by the check_test_run tier, which needs a finished pipeline run and so cannot
# contribute here.
#
# Two things will move this number without a single test being written.  The
# five engine modules leaving for structure-negative-steering are 5215
# statements at 0% on this tier, and dropping them takes the figure to 16.56%.
# The analyses leaving for their own repository take their scripts with them,
# though those are not under bin/ and so are not in this denominator.
#
# For comparison, structure-negative-steering gates at 100.0 over 8936
# statements.  It got there by building fixture run trees with known answers
# rather than by testing against a real cluster directory, which is the route
# open to this repository too.
# 35.0 is where it stands with the two negative-steering plot modules covered
# (bin/negsteer_plots.py 0 → 98%, bin/negsteer_within_sequence_plots.py
# 0 → 97%), which took the logic tier from 20.79% to 35.09%.
fail_under = 41.3
