# =============================================================================
# Full pipeline test params for the receptor-resurfacing pipeline
#
# This file replaces the previous params_test.yml. It defines the canonical
# end-to-end test run that:
#   1. Verifies all pipeline stages compose correctly (milestone verification).
#   2. Provides path-coverage data from which per-module test fixtures are
#      curated. See notes/inventory/14_phase_2_revision_per_module_tests.md
#      for context.
#
# Estimated runtime: 2-4 hours
#
# Submit:
#   sbatch run_pipeline.slurm.sh ./params_full_test.yml
#
# Resume after partial completion:
#   sbatch run_pipeline.slurm.sh ./params_full_test.yml --resume
# =============================================================================

# ── Project ───────────────────────────────────────────────────────────
project_name: "PikP1_AvrPikF_full_test"
outdir: "/hpc-home/jowillia/receptor_design/receptor-resurfacing-pipeline/tests/full_test_run/results"

# ── Execution ─────────────────────────────────────────────────────────
max_boltz2_parallel: 24

# ═════════════════════════════════════════════════════════════════════════
# INPUT MODE 2: Pre-docked complex PDB
# ═════════════════════════════════════════════════════════════════════════
pdb_file: "/hpc-home/jowillia/receptor_design/receptor-resurfacing-pipeline/tests/full_test_run/af3_pikp1_native_avrpikf_complex.pdb"
hotspot: ""

# ═════════════════════════════════════════════════════════════════════════
# SHARED SETTINGS
# ═════════════════════════════════════════════════════════════════════════

# ── Chain identifiers ─────────────────────────────────────────────────
receptor_chain: "A"
effector_chain: "C"

# ── Pose Solver — UNUSED in mode 2 (pre-docked complex) ──────────────
# Pose-solver params have no effect on this run.  The Branch-A
# cross-param rule (pose_solver_pairs non-empty) does NOT fire because
# receptor_input is not set, so these defaults can stay implicit.

# ── RFDiffusion ───────────────────────────────────────────────────────
contigs: "A1-32/10-20/A46-72/6-6 C"
hotspot: ""
num_designs: 64
rfdiff_iterations: 50
rfdiff_checkpoint: "Complex_beta_ckpt.pt"
min_hotspot_frac: 0.0
rfdiff_contact_cutoff: 8.0
add_potential: true
rfdiff_guide_scale: 2
rfdiff_guide_decay: "quadratic"
rfdiff_interface_weight: 1.0
rfdiff_rog_weight: 0.5
rfdiff_rog_min_dist: 5

# ── Rosetta pre-validation ────────────────────────────────────────────
sc_threshold: 0.5
stop_after_rosetta: false

# ── ProteinMPNN ───────────────────────────────────────────────────────
num_seqs: 2
mpnn_sampling_temp: 0.25
rm_aa: "C"
mpnn_top_n: 128

# ── ProteinMPNN sequence quality control ───────────────────────────────────────────────────
max_poly_x: 5
min_pct_identity: 0.0
max_pct_identity: 100.0

# ═════════════════════════════════════════════════════════════════════════
# Boltz2 negative-steering — all values from test_negative_steering.nf
# ═════════════════════════════════════════════════════════════════════════

# Steering strategy
negsteer_mode: "mild"
negsteer_max_mutations: 6
negsteer_candidate_pool_size: 10
negsteer_protected_set_source: "design_region_union"

# Design / seed counts
negsteer_n_designs: 4
negsteer_num_seeds: 3
negsteer_n_cycles: 1

# Boltz prediction hyperparameters
negsteer_diffusion_samples: 5
negsteer_recycling_steps: 3
negsteer_rmsd_threshold: 6.0
negsteer_contact_cutoff: 4.5
negsteer_no_kernels: true

# Post-processing thresholds
negsteer_postprocess_rmsd_threshold: 5.0
negsteer_postprocess_metric_column: "steered_ra_eff_vs_truth"
negsteer_postprocess_contact_cutoff: 5.0

# ── Negative controls ─────────────────────────────────────────────────
run_negative_controls: true
negsteer_controls_n_designs: 1
controls_warning_ipsae_max: 0.5
controls_warning_ra_eff_min: 5.0

# ── Interface metrics ─────────────────────────────────────────
interface_plddt_trim_threshold: 50.0
interface_intact_threshold: 5.0
weighted_jaccard_pair_cutoff: 8.0

# ── Orthogonal validation metrics ─────────────────────────────────────
af3_nomsa_seeds: [42, 123, 456]
orthogonal_filter_sc_min: 0.55
orthogonal_filter_bsa_min: 600
orthogonal_filter_plddt_min: 0.75
orthogonal_filter_af3_ra_max: 5.0
