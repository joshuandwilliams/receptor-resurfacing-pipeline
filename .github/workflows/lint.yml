name: Lint

on:
  push:
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      # The pinned version comes from the dev extra in pyproject, so CI and a
      # local run apply the same rule set. An unpinned ruff picks up new
      # default rules on release and fails CI on code that passed locally.
      - name: Install ruff
        run: pip install -e .[dev]

      # Configuration lives in pyproject under [tool.ruff]. Line length 100,
      # E, F, W and I, with E501 off. experiments/ and the two notebooks under
      # scripts/ are excluded there, each with its reason.
      #
      # `ruff format --check` is deliberately not run, matching the engine
      # repository. Linting is enforced, formatting is not.
      - name: ruff check
        run: ruff check .
